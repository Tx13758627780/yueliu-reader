name: Windows EXE and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'public/**', 'native/**', 'scripts/build-offline.mjs', 'scripts/build-desktop-api.mjs', 'scripts/prepare-android.mjs', 'scripts/build-android.mjs', 'tests/reader-updater.test.mjs', 'scripts/publish-clients.mjs', 'vite.offline.config.ts', 'tests/reader-back.test.mjs', 'package*.json', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run desktop:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Yueliu-Windows-EXE
          path: native/releases/*.exe
          if-no-files-found: error
          retention-days: 90
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Validate Android back navigation and exit timing
        run: node --test tests/reader-back.test.mjs tests/reader-updater.test.mjs tests/reader-discovery.test.mjs tests/reader-bili-api.test.mjs tests/reader-workspace.test.mjs
      - run: npm ci --prefix native --ignore-scripts
      - run: npm run android:prepare
      - name: Build installable APK
        run: node scripts/build-android.mjs
        env:
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING_JSON }}
      - uses: actions/upload-artifact@v4
        with:
          name: Yueliu-Android-APK
          path: native/releases/yueliu-android.apk
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [windows, android]
    if: github.repository == 'Tx13758627780/yueliu-reader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: yueliu-client-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Yueliu-*
          path: installers
          merge-multiple: true
      - name: Publish downloadable client preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-clients.mjs
