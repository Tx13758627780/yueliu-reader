name: Windows EXE and Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'components/**', 'lib/**', 'native/**', 'scripts/build-offline.mjs', 'scripts/build-desktop-api.mjs', 'scripts/prepare-android.mjs', 'vite.offline.config.ts', 'package*.json', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run desktop:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Yueliu-Windows-EXE
          path: native/releases/*.exe
          if-no-files-found: error
          retention-days: 90
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm ci --prefix native --ignore-scripts
      - run: npm run android:prepare
      - name: Build installable debug APK
        working-directory: native/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Yueliu-Android-APK
          path: native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
